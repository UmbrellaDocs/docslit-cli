openapi: "3.1.0"
info:
  title: Petstore API
  version: "1.0.0"
security:
  - apiKey: []
paths:
  /pets:
    parameters:
      - name: X-Request-ID
        in: header
        required: false
        schema:
          type: string
          format: uuid
    get:
      operationId: listPets
      summary: List all pets
      tags:
        - Pets
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
            example: 10
      responses:
        "200":
          description: A list of pets
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                    name:
                      type: string
              examples:
                default:
                  summary: Two pets
                  value:
                    - id: "abc123"
                      name: "Fido"
                    - id: "def456"
                      name: "Whiskers"
        "400":
          description: Bad request
    post:
      operationId: createPet
      summary: Create a pet
      tags:
        - Pets
      security:
        - apiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
              properties:
                name:
                  type: string
                  maxLength: 100
                  example: "Buddy"
                tag:
                  type: string
                  deprecated: true
            examples:
              default_example:
                summary: Create a dog
                value:
                  name: "Buddy"
                  tag: "dog"
      responses:
        "201":
          description: Pet created
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  name:
                    type: string
              examples:
                default_example:
                  summary: Created pet
                  value:
                    id: "xyz789"
                    name: "Buddy"
        "400":
          description: Bad request
  /pets/{petId}:
    get:
      operationId: getPet
      summary: Get a pet by ID
      tags:
        - Pets
      parameters:
        - name: petId
          in: path
          required: true
          schema:
            type: string
            example: "abc123"
      responses:
        "200":
          description: A single pet
          content:
            application/json:
              example:
                id: "abc123"
                name: "Fido"
        "404":
          description: Pet not found
components:
  securitySchemes:
    apiKey:
      type: apiKey
      name: X-API-Key
      in: header
webhooks:
  petAdopted:
    post:
      summary: Pet was adopted
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                petId:
                  type: string
                adoptedBy:
                  type: string
